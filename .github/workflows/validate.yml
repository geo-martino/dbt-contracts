name: "✅ Validate package deployment   "

on:
  pull_request:
    branches: [ master ]
    paths:
      - pyproject.toml
      - dbt_contracts/**
      - tests/**
      - .github/workflows/validate.yml

  workflow_dispatch:

  workflow_call:
    outputs:
      artifact-name:
        description: "The name of the uploaded package artifacts"
        value: ${{ jobs.build.outputs.artifact-name }}

permissions:
  contents: read

env:
  python-version: '3.13'

jobs:
  lint:
    name: 🔎 Lint
    runs-on: ubuntu-latest
    steps:
      - name: 🛒 Checkout
        uses: actions/checkout@v4

      - name: 🔎 Run ruff
        uses: astral-sh/ruff-action@v3

  test:
    name: 🧪 Run tests
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        name: [ 🐧 Linux ]
        python-version: [ 3.12, 3.13 ]
        # every supported dbt-core minor version; 1.6 is excluded as it requires pydantic<2
        dbt-version: [ "1.5", "1.7", "1.8", "1.9", "1.10", "1.11", "1.12" ]
        include:
          # TODO: disabled due to bug in uv action causing post-step to fail
          # Issue tracker: https://github.com/astral-sh/setup-uv/issues/226
#          - os: windows-latest
#            name: 🪟 Windows
#            python-version: 3.13
#            dbt-version: "1.12"
          - os: macos-latest
            name: 🍎 Mac
            python-version: 3.13
            dbt-version: "1.12"
    steps:
      - name: 🛒 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup - UV 🐍
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: 📥 Install dependencies with dbt-core ${{ matrix.dbt-version }}
        # resolve fresh rather than downgrading the locked env, which leaves newer dbt packages behind
        # setuptools provides the distutils module which dbt-core<1.6 needs on python>=3.12
        run: |
          uv venv
          uv pip install -e . --group test "dbt-core~=${{ matrix.dbt-version }}.0" setuptools
          uv run --no-sync python -c "import dbt.version; print('dbt-core', dbt.version.__version__)"

      - name: 🧪 Run tests
        run: |
          uv run --no-sync pytest -n auto -m "not manual" --junit-xml=test-results.xml

      - name: 📃 Publish test results report
        uses: pmeier/pytest-results-action@main
        with:
          path: test-results.xml
          summary: true
          display-options: fEX
          fail-on-empty: true
          title: Test results | ${{ matrix.name }} - 🐍 Python${{ matrix.python-version }} - dbt-core ${{ matrix.dbt-version }}

  build:
    name: 📦 Build package
    runs-on: ubuntu-latest
    needs: test
    env:
      artifact-name: python-package-distribution
    outputs:
      artifact-name: ${{ env.artifact-name }}
    steps:
      - name: 🛒 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup - UV 🐍
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.python-version }}

      - name: 📄 Sanitise readme
        run: |
          sed -i -r "s|\[\!(\w+)\]|**\\1:**|g" README.md

      - name: 🏗️ Build package
        run: |
          echo "Building artifacts for v$(uv run hatch version)"
          uv build

      - name: 📦 Upload package artifacts
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact-name }}
          path: dist/
          if-no-files-found: error
